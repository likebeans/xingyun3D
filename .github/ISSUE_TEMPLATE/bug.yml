name: Bug 报告
description: 报告可稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴 App Secret、Authorization、`.env` 内容或其他凭证；必要时请先脱敏。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
        - label: 我确认以下内容不含凭证或敏感信息
          required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期望什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、浏览器及 Node.js 版本
      placeholder: macOS 15 / Chrome 130 / Node.js 22
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选；请先删除 App ID、App Secret、Authorization 和其他敏感信息。
      render: shell
