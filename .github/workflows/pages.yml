# GitHub Pages 是公开静态站点。仓库 Variables 会写入页面源码，不能视为秘密。
name: GitHub Pages 部署

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/configure-pages@v5

      - name: 组装静态站点
        env:
          XMOV_APP_ID: ${{ vars.XMOV_APP_ID }}
          XMOV_APP_SECRET: ${{ vars.XMOV_APP_SECRET }}
          XMOV_GATEWAY_SERVER: ${{ vars.XMOV_GATEWAY_SERVER }}
          XMOV_AUTHORIZATION: ${{ vars.XMOV_AUTHORIZATION }}
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
